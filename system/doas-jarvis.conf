# /etc/doas.d/99-jarvis.conf – wird zuletzt gelesen, letzte passende Regel gewinnt.
# 1) Root für Menschen nur noch mit Passwort (5 min gemerkt) – überstimmt "permit nopass :wheel" aus 10-postmarketos.conf
permit persist keepenv :wheel
# 2) Jarvis darf passwortlos ausschließlich den geprüften Helfer ausführen
permit nopass harry as root cmd /usr/local/libexec/jarvis/jarvis-root
